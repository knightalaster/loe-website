<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter 1 - LOE</title>

  <style>
    body{
      margin:0;
      background:#0f111a;
      color:#e6e6e6;
      font-family:Arial, sans-serif;
    }

    header{
      padding:20px;
      background:#1b1f2b;
      border-bottom:1px solid #2d344a;
    }

    header a{
      color:#ff7272;
      text-decoration:none;
      font-weight:bold;
    }

    .container{
      max-width:800px;
      margin:auto;
      padding:20px;
    }

    .comic img{
      width:100%;
      display:block;
      margin-bottom:18px;
      border-radius:10px;
    }

    .nav{
      text-align:center;
      margin:40px 0;
    }

    .btn{
      background:#1c2235;
      border:1px solid #2d3550;
      padding:15px 25px;
      border-radius:12px;
      color:#fff;
      text-decoration:none;
      display:inline-block;
    }

    .btn:hover{
      border-color:#ff7272;
    }

    html{
  scroll-behavior:smooth;
    }

    .navbar{
  position:sticky;
  top:0;
  z-index:100;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:18px 30px;

  background:rgba(10,10,15,0.85);
  backdrop-filter:blur(12px);

  border-bottom:1px solid #242838;
}

.logo{
  font-family:'Orbitron', sans-serif;
  font-size:26px;
  color:#ff4d4d;
  letter-spacing:3px;
}

.nav-links{
  display:flex;
  gap:20px;
}

.nav-links a{
  color:#d6d9e5;
  text-decoration:none;
  transition:0.2s;
  font-size:15px;
}

.nav-links a:hover{
  color:#ff4d4d;
}

    .comments{
  margin-top:60px;
  padding:30px;
  background:#161b28;
  border:1px solid #2d3550;
  border-radius:20px;
}

.comments h2{
  margin-top:0;
  margin-bottom:20px;
}

.comments textarea{
  width:100%;
  height:120px;
  background:#0f111a;
  border:1px solid #2d3550;
  border-radius:12px;
  color:white;
  padding:15px;
  resize:none;
  font-size:15px;
  margin-bottom:15px;
}

.comments button{
  background:#ff7272;
  border:none;
  padding:12px 20px;
  border-radius:10px;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

.comments button:hover{
  opacity:0.85;
}

.comment{
  margin-top:20px;
  padding:15px;
  background:#0f111a;
  border-radius:12px;
  border:1px solid #2d3550;
}
  </style>
</head>

<body>

<header>
  <a href="manga.html">← Back to Chapters</a>
</header>

<div class="container">

  <div class="comic">
    <img src="Images/c1 (2).png">
    <img src="chapter1_2.jpg">
    <img src="chapter1_3.jpg">
  </div>

  <div class="comments">

  <h2>Comments</h2>

  <textarea placeholder="Write a comment..."></textarea>

  <button onclick="postComment()">Post</button>

  <div id="comment-list"></div>

  </div>
  <div class="nav">
    <a class="btn" href="chapter2.html">Next Chapter →</a>
  </div>

</div>

  <script>

function postComment(){

  let textarea = document.querySelector(".comments textarea");

  let text = textarea.value.trim();

  if(text === "") return;

  let comment = document.createElement("div");

  comment.className = "comment";

  comment.innerText = text;

  document.getElementById("comment-list").prepend(comment);

  textarea.value = "";

}

  </script>
</body>
  <nav class="navbar">

  <div class="logo">LOE</div>

  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="art.html">Art</a>
    <a href="manga.html">Manga</a>
    <a href="characters.html">Characters</a>
  </div>

  </nav>
</html>
