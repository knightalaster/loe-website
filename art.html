<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LOE Art Gallery</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#1b1f2b;
      color:#f0f0f0;
    }

    header{
      background:#23283a;
      padding:20px;
      border-bottom:1px solid #3a425c;
    }

    header a{
      color:#ff7272;
      text-decoration:none;
      font-weight:bold;
    }

    .container{
      max-width:1100px;
      margin:auto;
      padding:40px 20px;
    }

    h1{
      text-align:center;
      font-size:50px;
      margin-bottom:10px;
    }

    p{
      text-align:center;
      color:#b9c1d6;
      margin-bottom:40px;
    }

    /* SECTION TITLE */
    .section{
      margin-top:60px;
    }

    .section h2{
      font-size:30px;
      margin-bottom:10px;
    }

    /* GALLERY GRID */
    .gallery{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
      gap:10px;
    }

    .img{
      height:180px;
      background:#20263a;
      border-radius:12px;
      overflow:hidden;
      border:1px solid #404963;
      cursor:pointer;
      transition:0.2s;
    }

    .img:hover{
      transform:scale(1.03);
    }

    .img img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    /* LIGHTBOX */
    #lightbox{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.96);
      display:none;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      z-index:999;
      touch-action:none;

      opacity:0;
      transition:0.25s ease;
    }

    #lightbox-img{
      max-width:90%;
      max-height:90%;
      border-radius:12px;
      position:absolute;
      transition:0.25s;
    }

    html{
  scroll-behavior:smooth;
    }

  </style>

</head>

<body>

<header>
  <a href="index.html">← Back to Home</a>
</header>

<div class="container">

  <h1>ART GALLERY</h1>
  <p>LOE visual archive</p>

  <!-- CHARACTERS -->
  <div class="section">
    <h2>Characters</h2>

    <div class="gallery">

      <div class="img" onclick="openImage(0)">
        <img src="aero.jpg">
      </div>

      <div class="img" onclick="openImage(1)">
        <img src="matthew.jpg">
      </div>

      <div class="img" onclick="openImage(2)">
        <img src="bitey.jpg">
      </div>

    </div>
  </div>

  <!-- MAPS -->
  <div class="section">
    <h2>Maps</h2>

    <div class="gallery">

      <div class="img"><img src="emerald_map.jpg"></div>
      <div class="img"><img src="platinum_map.jpg"></div>
      <div class="img"><img src="void_map.jpg"></div>

    </div>
  </div>

  <!-- EYES -->
  <div class="section">
    <h2>Eyes</h2>

    <div class="gallery">

      <div class="img"><img src="original_eye.jpg"></div>
      <div class="img"><img src="orb.jpg"></div>
      <div class="img"><img src="virus_eye.jpg"></div>

    </div>
  </div>

</div>

<!-- LIGHTBOX -->
<div id="lightbox" onclick="closeImage()">
  <img id="lightbox-img">
</div>

<script>

let images = [];
let currentIndex = 0;
let scale = 1;

window.onload = () => {
  document.querySelectorAll(".gallery img").forEach(img => {
    images.push(img.src);
  });
};

function openImage(index){
  currentIndex = index;
  scale = 1;

  const lightbox = document.getElementById("lightbox");
  const img = document.getElementById("lightbox-img");

  img.src = images[currentIndex];

  lightbox.style.display = "flex";

  setTimeout(() => {
    lightbox.style.opacity = "1";
  }, 10);
}

function closeImage(){
  const lightbox = document.getElementById("lightbox");
  lightbox.style.opacity = "0";

  setTimeout(() => {
    lightbox.style.display = "none";
  }, 250);
}

/* swipe */
let startX = 0;

document.getElementById("lightbox").addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

document.getElementById("lightbox").addEventListener("touchend", e => {
  let endX = e.changedTouches[0].clientX;

  if(startX - endX > 50) nextImage();
  if(endX - startX > 50) prevImage();
});

function nextImage(){
  currentIndex = (currentIndex + 1) % images.length;
  updateImage();
}

function prevImage(){
  currentIndex = (currentIndex - 1 + images.length) % images.length;
  updateImage();
}

function updateImage(){
  document.getElementById("lightbox-img").src = images[currentIndex];
}

</script>

</body>
  <nav class="navbar">

  <div class="logo">LOE</div>

  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="art.html">Art</a>
    <a href="manga.html">Manga</a>
    <a href="characters.html">Characters</a>
  </div>

  </nav>
</html>
