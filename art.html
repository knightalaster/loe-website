<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LOE Art Gallery</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

  <style>

    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#1b1f2b;
      color:#f0f0f0;
    }

    header{
      background:#23283a;
      border-bottom:1px solid #3a425c;
      padding:20px;
      position:sticky;
      top:0;
    }

    header a{
      color:#ff7272;
      text-decoration:none;
      font-weight:bold;
    }

    .container{
      max-width:1100px;
      margin:auto;
      padding:50px 20px;
    }

    .title{
      text-align:center;
      margin-bottom:60px;
    }

    .title h1{
      font-family:'Orbitron', sans-serif;
      font-size:60px;
      margin-bottom:10px;
    }

    .title p{
      color:#b9c1d6;
    }

    /* SECTION */

    .section{
      margin-bottom:70px;
    }

    .section h2{
      font-size:40px;
      margin-bottom:10px;
    }

    .section p{
      color:#b9c1d6;
      margin-bottom:25px;
    }

    /* GRID */

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:20px;
    }

    /* CARD */

    .card{
      background:#2a3045;
      border:1px solid #404963;
      border-radius:25px;
      padding:20px;
      transition:0.2s;
    }

    .card:hover{
      transform:translateY(-4px);
      border-color:#ff7272;
    }

    .preview{
      width:100%;
      height:170px;
      background:#20263a;
      border-radius:15px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#7f8aa5;
      margin-bottom:10px;
    }

    .card h3{
      margin:0;
    }
    
    .card:hover .preview{
  filter:brightness(1.1);
  transform:scale(1.02);
  transition:0.2s;
    }

    .gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
  gap:10px;
}

.img{
  height:180px;
  background:#20263a;
  border-radius:12px;
  border:1px solid #404963;
  transition:0.2s;
}

.img:hover{
  transform:scale(1.03);
  border-color:#ff7272;
}

    .img{
  overflow:hidden;
}

.img img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
    
  </style>

</head>

<body>

<header>
  <a href="index.html">← Back to Home</a>
</header>

<div class="container">

  <div class="title">
    <h1>ART GALLERY</h1>
    <p>LOE fanart, maps, and eye visuals — all in one archive.</p>
  </div>

  <!-- 🔥 ONE BIG FANART WALL -->

  <div class="section">

  <h2>Characters</h2>
  <p>Art gallery of LOE characters.</p>

  <div class="gallery">

    <div class="img">
  <img src="Untitled263_20260419002946.png" />
    </div>
    <div class="img"></div>
    <div class="img"></div>
    <div class="img"></div>
    <div class="img"></div>
    <div class="img"></div>

  </div>

  </div>

  <!-- MAPS -->

  <div class="section">

    <h2>Maps</h2>

    <div class="grid">

      <div class="card"><div class="preview">Map</div><h3>Emerald Kingdom</h3></div>
      <div class="card"><div class="preview">Map</div><h3>Platinum Kingdom</h3></div>
      <div class="card"><div class="preview">Map</div><h3>The Void</h3></div>

    </div>

  </div>

  <!-- EYES -->

  <div class="section">

    <h2>Eyes</h2>

    <div class="grid">

      <div class="card"><div class="preview">Eye</div><h3>Original Eye</h3></div>
      <div class="card"><div class="preview">Eye</div><h3>Omnipotent Orb</h3></div>
      <div class="card"><div class="preview">Eye</div><h3>Virus Corruption</h3></div>

    </div>

  </div>

</div>

</body>

</html>
