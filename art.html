<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LOE Art Gallery</title>

  <style>

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#e9e9e9;
  color:#111;
}

/* HEADER */

header{
  padding:20px;
  background:#ffffffcc;
  backdrop-filter:blur(10px);
  border-bottom:1px solid #d0d0d0;
  position:sticky;
  top:0;
  z-index:100;
}

/* NAVIGATION */

nav{
  display:flex;
  gap:20px;
}

a{
  color:#cc2222;
  text-decoration:none;
  font-weight:bold;
}

a:hover{
  opacity:0.7;
}

/* HERO */

.hero{
  padding:100px 20px;
  text-align:center;
  background:linear-gradient(
    to bottom,
    #ffffff,
    #ececec
  );
}

.hero h1{
  font-size:70px;
  margin-bottom:20px;
  color:#cc2222;
}

/* SECTIONS */

.section{
  padding:60px 20px;
  max-width:1000px;
  margin:auto;
}

/* CARDS */

.card{
  background:white;
  border:1px solid #d8d8d8;
  border-radius:24px;
  padding:25px;
  margin-top:20px;
  box-shadow:0 4px 20px rgba(0,0,0,0.05);
  transition:0.2s;
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 25px rgba(0,0,0,0.08);
}

/* TITLES */

h1,h2,h3{
  color:#b81818;
}

/* FOOTER */

footer{
  padding:40px;
  text-align:center;
  color:#666;
}

  </style>
</head>

<body>

<header>
  <div>LOE Art Gallery</div>
  <a href="index.html">← Back to Home</a>
</header>

<div class="container">

  <h1>Art Gallery</h1>
  <p>All LOE character art, kingdoms, and comic pages will be displayed here.</p>

  <div class="grid">

    <div class="card">
      <div class="image-box">Image Here</div>
      <h3>Aero Smith Jr.</h3>
    </div>

    <div class="card">
      <div class="image-box">Image Here</div>
      <h3>Matthew</h3>
    </div>

    <div class="card">
      <div class="image-box">Image Here</div>
      <h3>Beatama</h3>
    </div>

    <div class="card">
      <div class="image-box">Image Here</div>
      <h3>Kingdom Maps</h3>
    </div>

  </div>

</div>

</body>
</html>
