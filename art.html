<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LOE Art Gallery</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#1b1f2b;
      color:#f0f0f0;
    }

    header{
      background:#23283a;
      padding:20px;
      border-bottom:1px solid #3a425c;
    }

    header a{
      color:#ff7272;
      text-decoration:none;
      font-weight:bold;
    }

    .container{
      max-width:1100px;
      margin:auto;
      padding:40px 20px;
    }

    h1{
      text-align:center;
      font-size:50px;
      margin-bottom:10px;
    }

    p{
      text-align:center;
      color:#b9c1d6;
      margin-bottom:40px;
    }

    /* GRID */

    .gallery{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
      gap:10px;
    }

    .img{
      height:180px;
      background:#20263a;
      border-radius:12px;
      overflow:hidden;
      border:1px solid #404963;
      cursor:pointer;
      transition:0.2s;
    }

    .img:hover{
      transform:scale(1.03);
    }

    .img img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    /* LIGHTBOX */

    #lightbox{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.96);
      display:none;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      z-index:999;
      touch-action:none;

      opacity:0;
      transition:0.25s ease;
    }

    #lightbox-img{
      max-width:90%;
      max-height:90%;
      border-radius:12px;
      transform:scale(1);
      transition:0.25s ease;
      position:absolute;
    }

  </style>

</head>

<body>

<header>
  <a href="index.html">← Back to Home</a>
</header>

<div class="container">

  <h1>ART GALLERY</h1>
  <p>LOE fanart collection</p>

  <div class="gallery">

    <div class="img" onclick="openImage(0)">
      <img src="Untitled263_20260419002946.png">
    </div>

    <div class="img" onclick="openImage(1)">
      <img src="matthew.jpg">
    </div>

    <div class="img" onclick="openImage(2)">
      <img src="bitey.jpg">
    </div>

  </div>

</div>

<!-- LIGHTBOX -->
<div id="lightbox" onclick="closeImage()">
  <img id="lightbox-img">
</div>

<script>

let images = [];
let currentIndex = 0;

/* zoom + swipe state */
let scale = 1;
let startX = 0;
let startY = 0;
let startDistance = 0;

window.onload = () => {
  document.querySelectorAll(".gallery img").forEach(img => {
    images.push(img.src);
  });
};

/* OPEN */
function openImage(index){
  currentIndex = index;
  scale = 1;

  const lightbox = document.getElementById("lightbox");
  const img = document.getElementById("lightbox-img");

  img.src = images[currentIndex];

  lightbox.style.display = "flex";

  setTimeout(() => {
    lightbox.style.opacity = "1";
  }, 10);
}

/* CLOSE */
function closeImage(){
  const lightbox = document.getElementById("lightbox");

  lightbox.style.opacity = "0";

  setTimeout(() => {
    lightbox.style.display = "none";
  }, 250);
}

/* SWIPE (touch) */
document.getElementById("lightbox").addEventListener("touchstart", e => {

  if(e.touches.length === 1){
    startX = e.touches[0].clientX;
  }

  /* PINCH START */
  if(e.touches.length === 2){
    startDistance = getDistance(e.touches);
  }

});

/* MOVE */
document.getElementById("lightbox").addEventListener("touchmove", e => {

  const img = document.getElementById("lightbox-img");

  /* PINCH ZOOM */
  if(e.touches.length === 2){
    let newDistance = getDistance(e.touches);
    let diff = newDistance / startDistance;

    scale *= diff;
    scale = Math.min(Math.max(0.8, scale), 3);

    img.style.transform = `scale(${scale})`;

    startDistance = newDistance;
  }

});

/* SWIPE END */
document.getElementById("lightbox").addEventListener("touchend", e => {

  if(e.changedTouches.length === 1){
    let endX = e.changedTouches[0].clientX;

    if(startX - endX > 50){
      nextImage();
    }

    if(endX - startX > 50){
      prevImage();
    }
  }

});

/* NEXT / PREV WITH ANIMATION */
function nextImage(){
  slideChange(1);
}

function prevImage(){
  slideChange(-1);
}

function slideChange(dir){

  const img = document.getElementById("lightbox-img");

  img.style.transition = "0.2s";
  img.style.transform = `translateX(${dir * -100}%) scale(${scale})`;

  setTimeout(() => {

    currentIndex = (currentIndex + dir + images.length) % images.length;

    img.src = images[currentIndex];

    img.style.transition = "0s";
    img.style.transform = `translateX(${dir * 100}%) scale(${scale})`;

    setTimeout(() => {
      img.style.transition = "0.25s";
      img.style.transform = `translateX(0px) scale(${scale})`;
    }, 20);

  }, 150);
}

/* helper for pinch */
function getDistance(touches){
  let dx = touches[0].clientX - touches[1].clientX;
  let dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

</script>

</body>
</html>
