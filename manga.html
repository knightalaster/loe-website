<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOE Manga</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#121522;
      color:#eaeaea;
    }

    header{
      text-align:center;
      padding:60px 20px 30px;
    }

    h1{
      font-size:50px;
      margin:0;
    }

    p{
      color:#aab3cc;
      margin-top:10px;
    }

    .menu{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
      gap:20px;
      max-width:800px;
      margin:50px auto;
      padding:0 20px;
    }

    .card{
      background:#1c2235;
      border:1px solid #2d3550;
      border-radius:16px;
      padding:30px;
      text-align:center;
      cursor:pointer;
    }

    .card:hover{
      border-color:#ff7272;
      transform:scale(1.03);
      transition:0.2s;
    }

    .title{
      font-size:20px;
      font-weight:bold;
    }

    .desc{
      font-size:13px;
      color:#9aa4bf;
      margin-top:10px;
    }

    html{
  scroll-behavior:smooth;
    }

    .navbar{
  position:sticky;
  top:0;
  z-index:100;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:18px 30px;

  background:rgba(10,10,15,0.85);
  backdrop-filter:blur(12px);

  border-bottom:1px solid #242838;
}

.logo{
  font-family:'Orbitron', sans-serif;
  font-size:26px;
  color:#ff4d4d;
  letter-spacing:3px;
}

.nav-links{
  display:flex;
  gap:20px;
}

.nav-links a{
  color:#d6d9e5;
  text-decoration:none;
  transition:0.2s;
  font-size:15px;
}

.nav-links a:hover{
  color:#ff4d4d;
}

    .card img{
  width:100%;
  height:280px;
  object-fit:cover;
  border-radius:16px;
  margin-bottom:20px;
    }
  </style>
</head>

<body>
