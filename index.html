<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOE Universe</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body{
      margin:0;
      font-family:'Inter', sans-serif;
      background:#0d1018;
      color:#eaeaea;
    }

    header{
      text-align:center;
      padding:60px 20px 30px;
    }

    h1{
  font-family:'Orbitron', sans-serif;
  font-size:70px;
  margin:0;
  letter-spacing:4px;
  color:#ff4d4d;
  text-shadow:0 0 20px rgba(255,77,77,0.35);
    }

    p{
      color:#aab3cc;
      margin-top:10px;
    }

    .menu{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
      gap:20px;
      max-width:900px;
      margin:50px auto;
      padding:0 20px;
    }

    .card{
  background:linear-gradient(145deg,#181d2b,#121622);
  border:1px solid #2d3448;
  border-radius:24px;
  padding:35px;
  text-align:center;
  cursor:pointer;
  transition:0.25s;
    }

    .card:hover{
  transform:translateY(-6px);
  border-color:#ff4d4d;
  box-shadow:0 0 25px rgba(255,77,77,0.15);
    }

    .title{
  font-family:'Orbitron', sans-serif;
  font-size:24px;
  margin-bottom:12px;
  color:#ff4d4d;
    }

    .desc{
      font-size:14px;
      color:#b6bfd8;
    }

    footer{
      text-align:center;
      margin-top:80px;
      padding:20px;
      color:#5d647a;
      font-size:12px;
    }

    html{
  scroll-behavior:smooth;
      }

  </style>
</head>

<body>

<header>
  <h1>LOE</h1>
  <p>League Of Eye Universe</p>
</header>

<div class="menu">

  <div class="card" onclick="location.href='art.html'">
    <div class="title">Art Gallery</div>
    <div class="desc">Characters, Maps, Eyes art collection</div>
  </div>

  <div class="card" onclick="location.href='manga.html'">
    <div class="title">LOE Indie Manga</div>
    <div class="desc">Read LOE manga chapters</div>
  </div>

  <div class="card" onclick="location.href='characters.html'">
    <div class="title">Characters</div>
    <div class="desc">Character explanations and profiles</div>
  </div>

</div>

<footer>
  LOE Universe Archive • Built by Sedoral
</footer>

</body>
</html>
