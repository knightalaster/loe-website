<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOE Universe</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#121522;
      color:#eaeaea;
    }

    header{
      text-align:center;
      padding:60px 20px 30px;
    }

    h1{
      font-size:60px;
      margin:0;
    }

    p{
      color:#aab3cc;
      margin-top:10px;
    }

    .menu{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
      gap:20px;
      max-width:900px;
      margin:50px auto;
      padding:0 20px;
    }

    .card{
      background:#1c2235;
      border:1px solid #2d3550;
      border-radius:16px;
      padding:30px;
      text-align:center;
      cursor:pointer;
      transition:0.2s;
    }

    .card:hover{
      transform:scale(1.05);
      border-color:#ff7272;
    }

    .title{
      font-size:22px;
      font-weight:bold;
      margin-bottom:10px;
    }

    .desc{
      font-size:14px;
      color:#9aa4bf;
    }

    footer{
      text-align:center;
      margin-top:80px;
      padding:20px;
      color:#5d647a;
      font-size:12px;
    }

  </style>
</head>

<body>

<header>
  <h1>LOE</h1>
  <p>League Of Eye Universe</p>
</header>

<div class="menu">

  <div class="card" onclick="location.href='art.html'">
    <div class="title">Art Gallery</div>
    <div class="desc">Characters, Maps, Eyes art collection</div>
  </div>

  <div class="card" onclick="location.href='comics.html'">
    <div class="title">LOE Indie Manga</div>
    <div class="desc">Read LOE manga chapters</div>
  </div>

  <div class="card" onclick="location.href='characters.html'">
    <div class="title">Characters</div>
    <div class="desc">Character explanations and profiles</div>
  </div>

</div>

<footer>
  LOE Universe Archive • Built by Sedoral
</footer>

</body>
</html>
